name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python runtime dependencies
        run: |
          python -m pip install --target py_modules -r requirements.txt
          python scripts/patch_ytmusicapi.py
      - name: Typecheck and build
        run: |
          pnpm exec tsc --noEmit --skipLibCheck
          pnpm run typecheck:backend
          pnpm run build
          pnpm run build:backend
      - name: Verify shipped audio engine and JavaScript runtime
        run: |
          python scripts/fetch_node_runtime.py --version v22.23.3 --destination bin/node --cache outputs/runtime-cache
          python scripts/fetch_ytdlp.py --version 2026.08.19 --destination bin/yt-dlp
          python scripts/verify_audio_runtime.py
      - name: Test
        run: |
          pnpm test
          pnpm exec vitest run --maxWorkers=1 --minWorkers=1
          pnpm run test:python
